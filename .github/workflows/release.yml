name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.2.3). Empty = <branch>_beta'
        required: false
        type: string

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
      version: ${{ steps.resolve_tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            INPUT_TAG="${{ github.event.inputs.version }}"
            if [ -n "${INPUT_TAG}" ]; then
              TAG="${INPUT_TAG}"
            else
              TAG="${GITHUB_REF_NAME}_beta"
            fi
          fi

          VERSION="${TAG#v}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.release_tag }}
          name: AI Toolbox ${{ steps.resolve_tag.outputs.release_tag }}
          body: |
            See assets below for installers.

            macOS install tip:
            If Gatekeeper blocks app launch, run:
            `xattr -cr /Applications/AI\ Toolbox.app`
          draft: true
          prerelease: false

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis,msi
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg,app
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './tauri -> target'
          shared-key: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Validate Tauri signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || (echo "ERROR: TAURI_SIGNING_PRIVATE_KEY is empty" >&2; exit 1)
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD may be empty (allowed)."

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          projectPath: tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: List generated bundles
        if: always()
        shell: bash
        run: |
          find tauri/target -maxdepth 4 -type f \
            \( -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.sig" \) \
            2>/dev/null || true

  update-homebrew-cask:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: [create-release, build]
    if: startsWith(needs.create-release.outputs.release_tag, 'v')
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.release_tag }}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --pattern '*.dmg' --repo "$GITHUB_REPOSITORY"

      - name: Generate Homebrew cask
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p Casks

          shopt -s nullglob
          arm_dmg=""
          intel_dmg=""
          for file in dl/*.dmg; do
            filename=$(basename "$file")
            case "$filename" in
              *aarch64*.dmg|*arm64*.dmg) arm_dmg="$filename" ;;
              *x86_64*.dmg|*x64*.dmg|*amd64*.dmg) intel_dmg="$filename" ;;
            esac
          done

          [ -n "$arm_dmg" ] && [ -n "$intel_dmg" ] || (echo "Failed to detect both macOS DMGs" >&2; exit 1)

          arm_sha=$(shasum -a 256 "dl/$arm_dmg" | awk '{print $1}')
          intel_sha=$(shasum -a 256 "dl/$intel_dmg" | awk '{print $1}')

          cat > Casks/ai-toolbox.rb <<EOF
cask "ai-toolbox" do
  version "${VERSION}"

  on_arm do
    sha256 "${arm_sha}"
    url "https://github.com/${REPO}/releases/download/v#{version}/${arm_dmg}",
        verified: "github.com/${REPO}/"
  end

  on_intel do
    sha256 "${intel_sha}"
    url "https://github.com/${REPO}/releases/download/v#{version}/${intel_dmg}",
        verified: "github.com/${REPO}/"
  end

  name "AI Toolbox"
  desc "Desktop toolbox for managing AI coding assistant configurations"
  homepage "https://github.com/${REPO}"

  app "AI Toolbox.app"
end
EOF

      - name: Commit and push cask update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/ai-toolbox.rb; then
            echo "No cask changes detected, skip."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${DEFAULT_BRANCH}"
          git add Casks/ai-toolbox.rb
          git commit -m "chore(cask): update ai-toolbox for ${{ needs.create-release.outputs.release_tag }}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-latest
    needs: [create-release, build]
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"

          mac_intel_url=""; mac_intel_sig=""
          mac_arm_url=""; mac_arm_sig=""
          win_url=""; win_sig=""
          linux_url=""; linux_sig=""

          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")

            case "$fname" in
              *aarch64*.app.tar.gz|*arm64*.app.tar.gz) mac_arm_url="$url"; mac_arm_sig="$sig_content" ;;
              *x64*.app.tar.gz|*x86_64*.app.tar.gz) mac_intel_url="$url"; mac_intel_sig="$sig_content" ;;
              *.AppImage|*.appimage) linux_url="$url"; linux_sig="$sig_content" ;;
              *-setup.exe) win_url="$url"; win_sig="$sig_content" ;;
              *.msi) [ -z "$win_url" ] && { win_url="$url"; win_sig="$sig_content"; } ;;
            esac
          done

          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"notes\": \"Release $TAG\","
            echo "  \"pub_date\": \"$PUB_DATE\","
            echo '  "platforms": {'
            first=1
            if [ -n "$mac_arm_url" ] && [ -n "$mac_arm_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"darwin-aarch64\": {\"signature\": \"$mac_arm_sig\", \"url\": \"$mac_arm_url\"}"
              first=0
            fi
            if [ -n "$mac_intel_url" ] && [ -n "$mac_intel_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"darwin-x86_64\": {\"signature\": \"$mac_intel_sig\", \"url\": \"$mac_intel_url\"}"
              first=0
            fi
            if [ -n "$win_url" ] && [ -n "$win_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-x86_64\": {\"signature\": \"$win_sig\", \"url\": \"$win_url\"}"
              first=0
            fi
            if [ -n "$linux_url" ] && [ -n "$linux_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64\": {\"signature\": \"$linux_sig\", \"url\": \"$linux_url\"}"
              first=0
            fi
            echo '  }'
            echo '}'
          } > latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
